<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>도서몰 - 구매 내역</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{layout :: body(content=~{::div.container})}">
    <div class="container mt-5">
        <h2>내 구매 내역</h2>

        <div class="mb-4">
            <p>현재까지 <strong th:text="${#lists.size(purchases)}">0</strong>권의 도서를 구매하셨습니다.</p>
        </div>

        <div class="table-responsive">
            <table class="table table-striped">
                <thead class="table-dark">
                <tr>
                    <th>도서명</th>
                    <th>출판사</th>
                    <th>구매일시</th>
                    <th>가격</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="purchase : ${purchases}">
                    <td>
                        <a th:href="@{/books/{id}(id=${purchase.book.bookid})}" th:text="${purchase.book.bookname}">
                            도서명
                        </a>
                    </td>
                    <td th:text="${purchase.book.publisher}">출판사</td>
                    <td th:text="${#temporals.format(purchase.purchaseDate, 'yyyy-MM-dd HH:mm')}">구매일시</td>
                    <td th:text="${#numbers.formatDecimal(purchase.price, 0, 'COMMA', 0, 'POINT')} + '원'">가격</td>
                </tr>
                <!-- 데이터가 없을 경우 표시할 내용 -->
                <tr th:if="${#lists.isEmpty(purchases)}">
                    <td colspan="4" class="text-center">구매 내역이 없습니다.</td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="mt-4">
            <a href="/books" class="btn btn-primary">도서 더 구경하기</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
