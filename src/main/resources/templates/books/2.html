<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>도서 상세 정보 - 축구 아는 여자</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>축구 아는 여자</h2>
    <table class="table">
        <tr>
            <th>도서 ID</th>
            <td>2</td>
        </tr>
        <tr>
            <th>출판사</th>
            <td>굿스포츠</td>
        </tr>
        <tr>
            <th>가격</th>
            <td>7,000원</td>
        </tr>
        <tr>
            <th>도서 분류</th>
            <td>스포츠</td>
        </tr>
        <tr>
            <th>도서 이미지</th>
            <td><img src="/images/book1.jpg" alt="축구의 역사" width="120"></td>
        </tr>
    </table>
    <div>
        <a href="/books" class="btn btn-secondary">목록으로</a>
        <!-- 로그인 시에만 구매 가능 -->
        <form th:if="${#authorization.expression('isAuthenticated()')}" method="post" action="/purchases" style="display:inline;">
            <input type="hidden" name="bookId" value="1">
            <button type="submit" class="btn btn-primary">구매하기</button>
        </form>
        <a th:if="${#authorization.expression('!isAuthenticated()')}" href="/login" class="btn btn-primary">구매하려면 로그인</a>
    </div>
</div>
</body>
</html>
